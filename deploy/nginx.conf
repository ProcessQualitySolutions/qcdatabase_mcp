# nginx reverse proxy for the hosted QC Database MCP server.
#
# The two lines that make or break a remote MCP server behind nginx:
#
#   proxy_set_header Host $host;   <- REQUIRED. Without it nginx sends the
#        upstream address (127.0.0.1:8000) as the Host header, and the
#        server's DNS-rebinding protection rejects every authenticated
#        request with 421 Misdirected Request.
#
#   proxy_buffering off;           <- Only matters if you re-enable SSE
#        responses (QCDB_MCP_JSON_RESPONSE=0); harmless otherwise. Buffered
#        SSE looks like a server that accepts connections but never answers.
#
# Get TLS certs with e.g.: sudo certbot --nginx -d mcp.qcdatabase.ai

server {
    listen 80;
    server_name mcp.qcdatabase.ai;   # CHANGE to your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.qcdatabase.ai;   # CHANGE to your domain

    ssl_certificate     /etc/letsencrypt/live/mcp.qcdatabase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.qcdatabase.ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;                # REQUIRED (see above)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                        # for SSE mode
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
